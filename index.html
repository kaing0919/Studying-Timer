<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scientific Study Timer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    :root {
      --primary-bg: linear-gradient(135deg, #1a1a1a 0%, #2b2b2b 100%);
      --secondary-bg: rgba(255, 255, 255, 0.05);
      --accent-gradient: linear-gradient(45deg, #4facfe, #00f2fe);
      --text-color: #ffffff;
      --timer-bg: rgba(255, 255, 255, 0.05);
      --timer-border: rgba(255, 255, 255, 0.1);
      --button-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
      --hover-shadow: 0 6px 20px rgba(79, 172, 254, 0.4);
    }

    [data-theme="light"] {
      --primary-bg: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      --secondary-bg: rgba(0, 0, 0, 0.05);
      --text-color: #2b2b2b;
      --timer-bg: rgba(0, 0, 0, 0.05);
      --timer-border: rgba(0, 0, 0, 0.1);
    }

    body {
      min-height: 100vh;
      background: var(--primary-bg);
      color: var(--text-color);
      display: flex;
      padding: 2rem;
      transition: all 0.3s ease;
    }

    .sidebar {
      width: 250px;
      background: var(--secondary-bg);
      border-radius: 20px;
      padding: 1.5rem;
      margin-right: 2rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .nav-item {
      padding: 1rem;
      margin-bottom: 0.5rem;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      color: var(--text-color);
      display: block;
    }

    .nav-item:hover {
      background: var(--secondary-bg);
    }

    .nav-item.active {
      background: var(--accent-gradient);
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    header {
      margin-bottom: 3rem;
      text-align: center;
      position: absolute;
      top:20px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 600;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
  
    }

    #countdown {
      font-size: 5rem;
      font-weight: 600;
      background: var(--timer-bg);
      border: 2px solid var(--timer-border);
      border-radius: 20px;
      padding: 2rem 3rem;
      min-width: 300px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      margin-bottom: 2rem;
      transition: all 0.3s ease;
      text-align: center;
    }

    .button-group {
      display: flex;
      gap: 1rem;
    }

    button {
      background: var(--accent-gradient);
      color: white;
      border: none;
      padding: 1rem 2rem;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: var(--button-shadow);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: var(--hover-shadow);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .stop-button {
      background: linear-gradient(45deg, #ff4b4b, #ff7676);
      box-shadow: 0 4px 15px rgba(255, 75, 75, 0.3);
    }

    .stop-button:hover {
      box-shadow: 0 6px 20px rgba(255, 75, 75, 0.4);
    }

    .theme-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: var(--secondary-bg);
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .theme-toggle:hover {
      transform: scale(1.1);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      fill: var(--text-color);
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
        padding: 1rem;
      }

      .sidebar {
        width: 100%;
        margin-right: 0;
        margin-bottom: 2rem;
      }

      h1 {
        font-size: 2rem;
      }

      #countdown {
        font-size: 3rem;
        padding: 1.5rem 2rem;
        min-width: 250px;
      }

      button {
        padding: 0.8rem 1.6rem;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <a href="index.html" class="nav-item active">Timer</a>
    <a href="history.html" class="nav-item">Study History</a>
  </div>

  <div class="main-content">

    <header><h1>Scientific Study Timer</h1></header>
    <div id="countdown">90:00</div>
    <div class="button-group">
      <button id="startBtn">Start Studying</button>
      <button id="pauseBtn" disabled>Pause</button>
      <button id="stopBtn" disabled class="stop-button">Stop</button>
    </div>
  </div>

  <!-- Sound placeholders -->
  <audio id="focusSound" src="./sounds/beep.mp3"></audio>
  <audio id="victorySound" src="https://www.soundjay.com/human/sounds/applause-8.mp3"></audio>

  <script>
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const stopBtn = document.getElementById('stopBtn');
    const countdownEl = document.getElementById('countdown');
    const focusSound = document.getElementById('focusSound');
    const victorySound = document.getElementById('victorySound');

    let studyInterval;
    let breakTimer;
    let restCountdown;
    let totalStudyTime = 90 * 60; // Fixed 90 minutes in seconds
    let breakTime = 20 * 60; // Fixed 20 minutes break
    let isPaused = false;
    let currentTime = totalStudyTime;
    let currentMode = 'idle'; // 'idle', 'studying', 'break', 'rest'
    let startTime;
    let actualStudyTime = 0;

    const navItems = document.querySelectorAll('.nav-item');
    const timerContent = document.querySelector('.timer-content');
    const historyContent = document.querySelector('.history-content');
    const historyList = document.getElementById('historyList');
    let studyHistory = JSON.parse(localStorage.getItem('studyHistory')) || [];

    function formatTime(seconds) {
      if (seconds < 0) return '00:00';
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateButtonStates() {
      startBtn.disabled = currentMode === 'studying' || currentMode === 'break';
      pauseBtn.disabled = currentMode === 'idle' || currentMode === 'break' || isPaused;
      stopBtn.disabled = currentMode !== 'studying';
    }

    function clearAllIntervals() {
      clearInterval(studyInterval);
      clearInterval(breakTimer);
      clearInterval(restCountdown);
    }

    function resetTimer() {
      clearAllIntervals();
      currentMode = 'idle';
      isPaused = false;
      currentTime = totalStudyTime;
      countdownEl.textContent = '90:00';
      updateButtonStates();
    }

    function saveStudySession(duration) {
      const session = {
        date: new Date().toISOString(),
        duration: duration,
        completed: true
      };
      const studyHistory = JSON.parse(localStorage.getItem('studyHistory')) || [];
      studyHistory.unshift(session);
      localStorage.setItem('studyHistory', JSON.stringify(studyHistory));
    }

    function stopStudySession() {
      if (currentMode !== 'studying') return;
      
      clearAllIntervals();
      const endTime = Date.now();
      const actualDuration = Math.floor((endTime - startTime) / 1000);
      actualStudyTime = actualDuration;
      
      saveStudySession(actualDuration);
      
      countdownEl.textContent = `Session ended! Studied for ${formatTime(actualDuration)}`;
      currentMode = 'idle';
      isPaused = false;
      updateButtonStates();
    }

    function startStudySession() {
      if (currentMode === 'studying') return;
      
      clearAllIntervals();
      currentMode = 'studying';
      isPaused = false;
      currentTime = totalStudyTime;
      startTime = Date.now();
      updateButtonStates();

      countdownEl.textContent = `Studying... ${formatTime(currentTime)}`;

      studyInterval = setInterval(() => {
        if (!isPaused) {
          currentTime--;
          countdownEl.textContent = `Studying... ${formatTime(currentTime)}`;

          if (currentTime <= 0) {
            clearInterval(studyInterval);
            victorySound.play().catch(e => console.log('Audio playback failed:', e));
            startBreak();
          }
        }
      }, 1000);

      scheduleRandomFocusTrigger();
    }

    function togglePause() {
      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? 'Resume' : 'Pause';
      countdownEl.textContent = isPaused 
        ? `Paused: ${formatTime(currentTime)}`
        : `${currentMode === 'studying' ? 'Studying...' : 'Break time!'} ${formatTime(currentTime)}`;
    }

    function scheduleRandomFocusTrigger() {
      if (currentMode !== 'studying') return;

      const randomDelay = Math.floor(Math.random() * (5 - 3 + 1) + 3) * 60 * 1000;

      setTimeout(() => {
        if (currentMode === 'studying' && !isPaused) {
          focusSound.play().catch(e => console.log('Audio playback failed:', e));
          triggerRestCountdown(10);
          scheduleRandomFocusTrigger();
        }
      }, randomDelay);
    }

    function triggerRestCountdown(seconds) {
      if (isPaused) return;

      let restTime = seconds;
      const prevText = countdownEl.textContent;
      countdownEl.textContent = `REST: ${formatTime(restTime)}`;

      restCountdown = setInterval(() => {
        if (!isPaused) {
          restTime--;
          countdownEl.textContent = `REST: ${formatTime(restTime)}`;
          if (restTime <= 0) {
            clearInterval(restCountdown);
            countdownEl.textContent = prevText;
          }
        }
      }, 1000);
    }

    function startBreak() {
      currentMode = 'break';
      isPaused = false;
      currentTime = breakTime;
      updateButtonStates();

      saveStudySession(totalStudyTime);

      countdownEl.textContent = `Break time! ${formatTime(currentTime)}`;

      breakTimer = setInterval(() => {
        if (!isPaused) {
          currentTime--;
          countdownEl.textContent = `Break time! ${formatTime(currentTime)}`;

          if (currentTime <= 0) {
            clearInterval(breakTimer);
            countdownEl.textContent = `Break ended! Great job 🎉`;
            resetTimer();
          }
        }
      }, 1000);
    }

    function updateHistoryDisplay() {
      historyList.innerHTML = '';
      studyHistory.forEach(session => {
        const li = document.createElement('li');
        li.className = 'history-item';
        
        const date = new Date(session.date);
        const formattedDate = date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
        
        li.innerHTML = `
          <span class="date">${formattedDate}</span>
          <span class="duration">${formatTime(session.duration)}</span>
        `;
        historyList.appendChild(li);
      });
    }

    function switchTab(tab) {
      navItems.forEach(item => {
        item.classList.remove('active');
        if (item.dataset.tab === tab) {
          item.classList.add('active');
        }
      });

      if (tab === 'timer') {
        timerContent.style.display = 'flex';
        historyContent.classList.remove('active');
      } else {
        timerContent.style.display = 'none';
        historyContent.classList.add('active');
        updateHistoryDisplay();
      }
    }

    // Event Listeners
    startBtn.addEventListener('click', startStudySession);
    pauseBtn.addEventListener('click', togglePause);
    stopBtn.addEventListener('click', stopStudySession);

    navItems.forEach(item => {
      item.addEventListener('click', () => {
        switchTab(item.dataset.tab);
      });
    });

    // Handle page visibility changes
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && currentMode !== 'idle') {
        isPaused = true;
        pauseBtn.textContent = 'Resume';
      }
    });

    // Initialize button states
    updateButtonStates();
    resetTimer();
    updateHistoryDisplay();

    // Add theme toggle functionality
    const themeToggle = document.getElementById('themeToggle');
    const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)');
    
    function setTheme(isDark) {
      document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    function toggleTheme() {
      const currentTheme = document.body.getAttribute('data-theme');
      setTheme(currentTheme !== 'dark');
    }

    // Initialize theme
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      setTheme(savedTheme === 'dark');
    } else {
      setTheme(prefersDarkScheme.matches);
    }
    themeToggle.addEventListener('click', toggleTheme);

    // Update clear history functionality
    function clearHistory() {
      if (confirm('Are you sure you want to clear all study history?')) {
        localStorage.removeItem('studyHistory');
        studyHistory = [];
        updateHistoryDisplay();
      }
    }

    // Add clear history button event listener
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    if (clearHistoryBtn) {
      clearHistoryBtn.addEventListener('click', clearHistory);
    }
  </script>
</body>
</html>
