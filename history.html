<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Study History - Scientific Study Timer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    :root {
      --primary-gradient: linear-gradient(45deg, #4facfe, #00f2fe);
      --danger-gradient: linear-gradient(45deg, #ff4b4b, #ff7676);
      --bg-gradient: linear-gradient(135deg, #1a1a1a 0%, #2b2b2b 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --text-color: #ffffff;
      --accent-color: #4facfe;
    }

    [data-theme="light"] {
      --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      --card-bg: rgba(255, 255, 255, 0.8);
      --text-color: #2b2b2b;
      --accent-color: #4facfe;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-color);
      display: flex;
      padding: 2rem;
      transition: background 0.3s ease;
    }

    .sidebar {
      width: 250px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 1.5rem;
      margin-right: 2rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .nav-item {
      padding: 1rem;
      margin-bottom: 0.5rem;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      color: var(--text-color);
      display: block;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .nav-item.active {
      background: var(--primary-gradient);
    }

    .theme-toggle {
      margin-top: 2rem;
      padding: 0.8rem;
      border-radius: 12px;
      background: var(--card-bg);
      border: none;
      color: var(--text-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .main-content {
      flex: 1;
      max-width: 1200px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 600;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .stat-card h3 {
      color: var(--accent-color);
      margin-bottom: 0.5rem;
      font-size: 1rem;
    }

    .stat-card p {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .charts-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .chart-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .chart-card h3 {
      color: var(--accent-color);
      margin-bottom: 1rem;
    }

    .history-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .history-table th,
    .history-table td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .history-table th {
      background: rgba(255, 255, 255, 0.1);
      font-weight: 600;
      color: var(--accent-color);
    }

    .history-table tr:last-child td {
      border-bottom: none;
    }

    .history-table tr:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .clear-button {
      background: var(--danger-gradient);
      color: white;
      border: none;
      padding: 0.8rem 1.6rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 75, 75, 0.3);
    }

    .clear-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 75, 75, 0.4);
    }

    .clear-button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
        padding: 1rem;
      }

      .sidebar {
        width: 100%;
        margin-right: 0;
        margin-bottom: 2rem;
      }

      .charts-container {
        grid-template-columns: 1fr;
      }

      .history-table {
        display: block;
        overflow-x: auto;
      }

    }
  </style>
</head>
<body>
  <div class="sidebar">
    <a href="index.html" class="nav-item">Timer</a>
    <a href="history.html" class="nav-item active">Study History</a>
    <button class="theme-toggle" id="themeToggle">
      <span>Toggle Theme</span>
    </button>
  </div>

  <div class="main-content">
    <header>
 
      <div class="header-actions">
        <button id="clearHistoryBtn" class="clear-button">Clear History</button>
      </div>
    </header>

    <div class="stats-container">
      <div class="stat-card">
        <h3>Total Study Time</h3>
        <p id="totalTime">00:00</p>
      </div>
      <div class="stat-card">
        <h3>Total Sessions</h3>
        <p id="totalSessions">0</p>
      </div>
      <div class="stat-card">
        <h3>Average Session</h3>
        <p id="averageSession">00:00</p>
      </div>
      <div class="stat-card">
        <h3>Today's Study Time</h3>
        <p id="todayTime">00:00</p>
      </div>
    </div>

    <div class="charts-container">
      <div class="chart-card">
        <h3>Weekly Study Time</h3>
        <canvas id="weeklyChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>Best Study Times</h3>
        <canvas id="timeDistributionChart"></canvas>
      </div>
    </div>

    <table class="history-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Start Time</th>
          <th>Duration</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="historyTableBody">
        <!-- Table rows will be added here -->
      </tbody>
    </table>
  </div>

  <script>
    // Theme handling
    const themeToggle = document.getElementById('themeToggle');
    const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)');
    
    function setTheme(isDark) {
      document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    function toggleTheme() {
      const currentTheme = document.body.getAttribute('data-theme');
      setTheme(currentTheme !== 'dark');
    }

    // Initialize theme
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      setTheme(savedTheme === 'dark');
    } else {
      setTheme(prefersDarkScheme.matches);
    }

    themeToggle.addEventListener('click', toggleTheme);

    // Chart colors based on theme
    function getChartColors() {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      return {
        background: isDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.1)',
        border: isDark ? '#4facfe' : '#00f2fe',
        pointBackground: isDark ? '#4facfe' : '#00f2fe',
      };
    }

    function formatTime(seconds) {
      if (seconds < 0) return '00:00';
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString();
    }

    function formatTimeOnly(dateString) {
      const date = new Date(dateString);
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function getWeekDates() {
      const dates = [];
      const today = new Date();
      for (let i = 6; i >= 0; i--) {
        const date = new Date(today);
        date.setDate(date.getDate() - i);
        dates.push(date.toISOString().split('T')[0]);
      }
      return dates;
    }

    function getTimeDistribution(history) {
      const distribution = new Array(24).fill(0);
      history.forEach(session => {
        const hour = new Date(session.date).getHours();
        distribution[hour] += session.duration;
      });
      return distribution;
    }

    function updateCharts(history) {
      const colors = getChartColors();
      
      // Weekly Chart
      const weeklyCtx = document.getElementById('weeklyChart').getContext('2d');
      const weekDates = getWeekDates();
      const weeklyData = weekDates.map(date => {
        return history
          .filter(session => session.date.startsWith(date))
          .reduce((sum, session) => sum + session.duration, 0);
      });

      new Chart(weeklyCtx, {
        type: 'bar',
        data: {
          labels: weekDates.map(date => new Date(date).toLocaleDateString(undefined, { weekday: 'short' })),
          datasets: [{
            label: 'Study Time (minutes)',
            data: weeklyData.map(seconds => Math.floor(seconds / 60)),
            backgroundColor: colors.background,
            borderColor: colors.border,
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          scales: {
            y: {
              beginAtZero: true
            }
          }
        }
      });

      // Time Distribution Chart
      const timeDistCtx = document.getElementById('timeDistributionChart').getContext('2d');
      const timeDistribution = getTimeDistribution(history);
      
      new Chart(timeDistCtx, {
        type: 'line',
        data: {
          labels: Array.from({length: 24}, (_, i) => `${i}:00`),
          datasets: [{
            label: 'Study Time (minutes)',
            data: timeDistribution.map(seconds => Math.floor(seconds / 60)),
            backgroundColor: colors.background,
            borderColor: colors.border,
            borderWidth: 2,
            pointBackgroundColor: colors.pointBackground,
            fill: true
          }]
        },
        options: {
          responsive: true,
          scales: {
            y: {
              beginAtZero: true
            }
          }
        }
      });
    }

    const clearHistoryBtn = document.getElementById('clearHistoryBtn');

    function updateHistory() {
      const studyHistory = JSON.parse(localStorage.getItem('studyHistory')) || [];
      const tableBody = document.getElementById('historyTableBody');
      const totalTimeElement = document.getElementById('totalTime');
      const totalSessionsElement = document.getElementById('totalSessions');
      const averageSessionElement = document.getElementById('averageSession');
      const todayTimeElement = document.getElementById('todayTime');

      // Enable/disable Clear History button
      clearHistoryBtn.disabled = studyHistory.length === 0;

      // Clear existing rows
      tableBody.innerHTML = '';

      // Calculate statistics
      const totalSeconds = studyHistory.reduce((sum, session) => sum + session.duration, 0);
      const averageSeconds = studyHistory.length > 0 ? Math.round(totalSeconds / studyHistory.length) : 0;
      const today = new Date().toISOString().split('T')[0];
      const todaySeconds = studyHistory.filter(session => session.date.startsWith(today)).reduce((sum, session) => sum + session.duration, 0);

      // Update statistics
      totalTimeElement.textContent = formatTime(totalSeconds);
      totalSessionsElement.textContent = studyHistory.length;
      averageSessionElement.textContent = formatTime(averageSeconds);
      todayTimeElement.textContent = formatTime(todaySeconds);

      // Update charts
      updateCharts(studyHistory);

      // Add rows to table
      studyHistory.forEach(session => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${formatDate(session.date)}</td>
          <td>${formatTimeOnly(session.date)}</td>
          <td>${formatTime(session.duration)}</td>
          <td>${session.completed ? 'Completed' : 'Incomplete'}</td>
        `;
        tableBody.appendChild(row);
      });
    }

    clearHistoryBtn.addEventListener('click', () => {
      if (confirm('Are you sure you want to clear all study history?')) {
        localStorage.removeItem('studyHistory');
        updateHistory();
      }
    });

    // Update history when page loads
    updateHistory();

    // Update history when theme changes
    document.body.addEventListener('themeChanged', updateHistory);
  </script>
</body>
</html>
